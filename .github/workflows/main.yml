name: Build YMOBD XU7 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Gradle project
        run: |
          find . -name settings.gradle -o -name settings.gradle.kts
          find . -name build.gradle -o -name build.gradle.kts
          find . -name gradlew

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(dirname "$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YMOBD-XU7-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
